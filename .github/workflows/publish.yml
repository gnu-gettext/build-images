name: Build and Publish Docker Image

# Documentation:
# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images
# https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry

on:
  # Rebuild after each push to the master branch.
  #push:
  #  branches: ["master"]
  # Allow rebuilding manually from the GitHub UI.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/from-ubuntu24.04
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: based-on-ubuntu24/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

# After running this action:
# 1. Visit https://github.com/orgs/gnu-gettext/packages
# 2. Select the just-created image.
# 3. Click on "Package settings".
# 4. Under "Danger zone", "Change package visibility" > Public.
# 5. Verify:
#    $ docker pull ghcr.io/gnu-gettext/build-images/from-ubuntu24.04:latest
